# Conda environment for PXRDnet inference, following upstream requirements.txt (torch 2.0.x,
# torch-geometric 2.5.3, PyTorch Lightning 2.2, pymatgen 2023.3.10) with the CUDA 11.8 torch build.
name: pxrdnet
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - --find-links https://data.pyg.org/whl/torch-2.0.0+cu118.html
      - torch==2.0.1+cu118  # 2.0.0 wheels miss libnvrtc for cuDNN convolutions (fixed in 2.0.1)
      - torch-scatter==2.1.2+pt20cu118
      - torch-sparse==0.6.18+pt20cu118
      - torch-geometric==2.5.3
      - pytorch_lightning==2.2.0.post0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - matminer==0.9.2
      - matplotlib==3.8.4
      - networkx==3.2.1
      - numpy==1.26.4
      - p_tqdm==1.4.0
      - pandas==1.5.3
      - pymatgen==2023.3.10
      - python-dotenv==1.0.1
      - scikit_learn==1.4.2
      - scipy==1.13.0
      - SMACT==2.5.5
      - sympy==1.12
      - tqdm==4.66.2
      - wandb==0.16.3
      - huggingface_hub==0.24.6
      - setuptools==68.2.2
      - pyyaml
