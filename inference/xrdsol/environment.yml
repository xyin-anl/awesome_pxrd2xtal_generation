# Conda environment for XRDSol inference. Library versions follow upstream's README (Python 3.8,
# PyTorch Lightning 1.3.8, torch-geometric 1.7.2, hydra 1.1.0, pymatgen 2023.5.10) except torch: upstream's torch 1.9
# cannot run on current GPUs and drivers, so this uses torch 1.13.1 with CUDA 11.7, the same stack
# as inference/crystalyze.
name: xrdsol
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu117
      - --find-links https://data.pyg.org/whl/torch-1.13.1+cu117.html
      - torch==1.13.1+cu117
      - torch-scatter==2.1.1+pt113cu117
      - torch-sparse==0.6.17+pt113cu117
      - torch-cluster==1.6.1+pt113cu117
      - torch-spline-conv==1.2.2+pt113cu117
      - torch-geometric==1.7.2
      - pytorch-lightning==1.3.8
      - torchmetrics==0.6.0
      - hydra-core==1.1.0
      - omegaconf==2.1.2
      - antlr4-python3-runtime==4.8
      - pymatgen==2023.5.10  # upstream README pin
      - spglib==2.3.0
      - smact==2.2.1
      - numpy==1.24.4
      - scipy==1.10.1
      - pandas==2.0.3
      - scikit-learn==1.3.2
      - sympy==1.12
      - networkx==3.1
      - p-tqdm==1.3.3
      - python-dotenv==1.0.0
      - matplotlib==3.7.5
      - setuptools==59.5.0
      - pyyaml
      - pyxtal==0.6.0
      - pyshtools==4.10.4  # pyxtal dependency; this version ships Python 3.8 wheels
      - chemparse==0.1.2
      - einops==0.7.0
