# Conda environment for Bragglite inference. setup.sh creates it, clones upstream PXRD-Bench at the
# pinned commit, and downloads the official checkpoint archive. Python and every package version are
# upstream's uv.lock at that commit (the runtime closure of pyproject.toml; torch 2.8.0 for CUDA
# 12.8, whose nvidia-* wheels torch pins itself). Left out: wandb (the training logger) with its own
# dependencies, and the pytest dev group; nothing on the inference path imports them.
name: bragglite
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - numpy==1.26.4
      - scipy==1.15.3
      - pymatgen==2024.11.13
      - spglib==2.8.0
      - antlr4-python3-runtime==4.9.3
      - ase==3.27.0
