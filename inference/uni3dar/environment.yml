# Conda environment for Uni-3DAR PXRD inference. setup.sh creates it, installs Uni-Core (without
# its optional CUDA extensions), clones upstream, and downloads the checkpoint.
# flash-attn is required by upstream's attention layers: an NVIDIA GPU with compute capability
# >= 8.0 (Ampere or newer) is needed, and the prebuilt wheel targets torch 2.6 / CUDA 12 / Python 3.11.
name: uni3dar
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.6.0
      - https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp311-cp311-linux_x86_64.whl
      - numpy==2.2.4
      - scipy==1.15.3
      - pymatgen==2025.10.7
      - numba==0.61.2
      - lmdb==1.6.2
      - ase==3.25.0
      - scikit-learn==1.6.1
      - tqdm
      - pyyaml
